<!DOCTYPE html>
<html lang="en">
<!--
	Maple Survivors web shell (spec #130, ADR 0004). The Web export preset in game/export_presets.cfg uses this file as
	its custom HTML shell (html/custom_html_shell = "res://../web/index.html"); Godot fills in the $GODOT_* placeholders
	at export. This is the minimal shell from the web build spike (#131): it starts the engine and reports when the game
	quits. The import screen, storage and save backup come with the web shell ticket (#133).

	Query parameters: each `arg=<value>` is passed to the game as one user argument after `--`, the same as
	`bash scripts/run.sh -- <args>` on desktop (e.g. `?arg=--run=henesys_hg1&arg=--autoplay&arg=--perf`).
	Dev-only cache injection lives in web/dev/ and is never part of an export.
-->
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-progress {
	width: 50%;
	display: none;
}

#status-notice {
	display: none;
	margin: 0 2rem;
	padding: 1rem;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	background-color: #5b3943;
	color: #e0e0e0;
	font-family: Arial, sans-serif;
	line-height: 1.3;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	function showProgress() {
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'block';
		statusNotice.style.display = 'none';
	}

	function showNotice(text) {
		statusNotice.textContent = text;
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = 'none';
		statusNotice.style.display = 'block';
	}

	function hideStatus() {
		statusOverlay.style.visibility = 'hidden';
	}

	// User arguments from the query string, one `arg=` per argument.
	const userArgs = new URLSearchParams(window.location.search).getAll('arg');
	const args = userArgs.length ? ['--'].concat(userArgs) : [];

	const engine = new Engine(GODOT_CONFIG);
	// Read by browser automation: the engine, and the exit code once the game has quit.
	window.godotEngine = engine;
	window.godotExitCode = null;

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showNotice('This browser lacks features the game needs:\n' + missing.join('\n'));
		return;
	}

	showProgress();
	engine.startGame({
		'args': args,
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			}
		},
		'onExit': function (code) {
			// The engine has made its final IndexedDB sync before calling this (Godot's GodotOS.finish_async).
			window.godotExitCode = code;
			showNotice('The game has quit (exit code ' + code + '). Reload the page to play again.');
		},
	}).then(hideStatus, function (err) {
		console.error(err);
		showNotice(err instanceof Error ? err.message : String(err));
	});
}());
		</script>
	</body>
</html>
